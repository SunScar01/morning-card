<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">

    <header class="greeting">
      <p class="label" id="day-label">morning</p>
      <h1 class="title">good morning, sunny.</h1>
      <p class="subtitle">Three cards. One day. Pick with your gut.</p>
    </header>

    <section class="cards" id="cards" aria-label="Today's three cards"></section>

    <section class="reading-area">
      <p id="prompt" class="prompt">Tap a card to flip it. The other two stay a mystery.</p>

      <article id="reading" class="reading" hidden>
        <h2 id="reading-name" class="reading-name"></h2>
        <p id="reading-message" class="reading-message"></p>
        <hr>
        <p class="nudge-label">TINY NUDGE</p>
        <p id="reading-nudge" class="nudge"></p>
      </article>
    </section>

  </main>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
